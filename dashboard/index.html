<div class="wrap dash-head">
  <h1>Media Slant Dashboard</h1>
  <p class="lead">Emotions and topics in 2.9 million articles from 35 Czech, Hungarian, Polish and Slovak news outlets, January 2018 – March 2024. <a href="{{ '/dashboard/v4_dashboard.html' | relative_url }}?v={{ site.time | date: '%s' }}">Open in a separate window</a></p>
</div>
<div class="dash-wrap">
  <iframe id="dash" class="dash-frame" src="{{ '/dashboard/v4_dashboard.html' | relative_url }}?v={{ site.time | date: '%s' }}" title="V4 Media Slant Dashboard" scrolling="no"></iframe>
</div>
<script>
(function () {
  var frame = document.getElementById('dash');
  var watched = null;
  function fit() {
    try {
      var doc = frame.contentDocument;
      if (!doc || !doc.body || doc.readyState === 'loading') return;
      var b = doc.body, cs = doc.defaultView.getComputedStyle(b);
      var h = b.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom);
      if (h > 200) frame.style.height = Math.ceil(h) + 'px';
      if (watched !== doc) {
        watched = doc;
        if (window.ResizeObserver) new ResizeObserver(fit).observe(b);
        doc.addEventListener('click', function () { setTimeout(fit, 80); });
        doc.addEventListener('change', function () { setTimeout(fit, 80); });
      }
    } catch (e) { /* not same-origin: keep the CSS height */ }
  }
  frame.addEventListener('load', fit);
  window.addEventListener('resize', fit);
  var n = 0, t = setInterval(function () { fit(); if (++n > 40) clearInterval(t); }, 250);
})();
</script>
