---
layout: default
title: Blog
permalink: /blog/
---
<div class="wrap page">
  <header class="page-head">
    <h1>Blog</h1>
    <p class="lead">Short essays on media bias: concepts, measurement, and case studies from the Visegrad countries.</p>
  </header>
  {% assign posts = site.blog | sort: "order" %}
  <div class="cards">
    {% for post in posts %}
    <div class="card">
      <span class="num">{{ post.order }}</span>
      <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
      <p>{{ post.summary }}</p>
    </div>
    {% endfor %}
  </div>
</div>
