---
layout: default
title: Blog
permalink: /blog/
---
<div class="wrap page">
  <header class="page-head">
    <h1>Blog</h1>
    <p class="lead">Short essays on media bias: concepts, measurement, and case studies from the Visegrad countries.</p>
  </header>
  {% assign posts = site.blog | sort: "order" %}
  <ul class="post-list">
    {% for post in posts %}
    <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a><p>{{ post.summary }}</p></li>
    {% endfor %}
  </ul>
</div>
